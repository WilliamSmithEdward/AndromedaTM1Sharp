name: CI

# The library built and packed as nuget.org would receive it. There are no
# tests: every call needs a live TM1 server, and CI has none.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build and pack the NuGet package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # packages.lock.json is the record of what the package depends on;
      # locked mode fails instead of resolving anything it does not name.
      - name: Restore from the lock file
        run: dotnet restore AndromedaTM1Sharp.sln --locked-mode

      - name: Build Release with warnings as errors
        run: dotnet build AndromedaTM1Sharp.sln --no-restore -c Release -warnaserror

      - name: Pack
        run: dotnet pack AndromedaTM1Sharp.sln --no-build -c Release -o dist

      # nuget.org shows the README and the icon, and IntelliSense reads the
      # XML docs: a package without any of them is a broken release.
      - name: Check the package holds the dll, XML docs, README and icon
        run: |
          set -- dist/*.nupkg
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "want exactly one .nupkg, found: $*"; exit 1; }
          unzip -p "$1" README.md > packaged-readme.md
          cmp README.md packaged-readme.md
          unzip -Z1 "$1" > contents.txt
          cat contents.txt
          for want in lib/net10.0/AndromedaTM1Sharp.dll lib/net10.0/AndromedaTM1Sharp.xml README.md AndromedaTM1Sharp.png; do
            grep -qxF "$want" contents.txt || { echo "missing from the package: $want"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: dist/
          if-no-files-found: error

  # The one check the main ruleset requires. It fails unless every job above
  # passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
